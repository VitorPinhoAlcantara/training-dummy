# Widens RangedAttribute's private final maxValue field to public and non-final so
# TrainingDummyMod can raise the ceilings vanilla bakes into MAX_HEALTH (1024) and ATTACK_DAMAGE
# (2048) - both silently clamp any higher value a mod sets, regardless of what the actual
# attribute base value is. See TrainingDummyMod#widenVanillaAttributeRanges.
public-f net.minecraft.world.entity.ai.attributes.RangedAttribute maxValue # maxValue
