# NOTE (26.1.2 port): the modLoader/loaderVersion top-level keys that used to be mandatory here
# are gone in this format version - confirmed by diffing against a known-working 26.1.2 mod
# project. Do not add them back without re-checking against a real working example.

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
license="${mod_license}"

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# The description text for the mod (multi line!) (#mandatory)
description='''
Adds a training dummy: an invulnerable player-shaped target you can gear up
(armor, shield, Curios accessories) that reports the damage dealt to it.
'''

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Curios is an optional soft-dependency: the dummy's accessory slots only appear when it's installed.
[[dependencies.${mod_id}]]
    modId="curios"
    type="optional"
    reason="Adds accessory/curio slots to the dummy's inventory, and lets mods like Artifacts/Relics that hook into Curios work on it too"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
