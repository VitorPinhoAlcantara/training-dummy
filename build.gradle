plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {





    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {

    srcDir('src/generated/resources')


    exclude("**/*.bbmodel")

    exclude("src/generated/**/.cache")
}

repositories {

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}


java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {

    version = project.neo_version










    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'guideme.trainingdummy.guide.sources',
                    file('src/main/resources/assets/trainingdummy/guides/trainingdummy/guide').absolutePath
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }



        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {

            clientData()




            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }


        configureEach {





            systemProperty 'forge.logging.markers', 'REGISTRIES'




            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {



        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}





configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {




    compileOnly "maven.modrinth:curios:${curios_version}"
    localRuntime "maven.modrinth:curios:${curios_version}"





    localRuntime "maven.modrinth:artifacts:${artifacts_version}"
    localRuntime "maven.modrinth:jei:${jei_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:mahou-tsukai:${mahoutsukai_version}"
    compileOnly "maven.modrinth:guideme:${guideme_version}"
    localRuntime "maven.modrinth:guideme:${guideme_version}"
}



var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}


sourceSets.main.resources.srcDir generateModMetadata

var secretsFile = file("secrets.properties")
var secretsProps = new Properties()
if (secretsFile.exists()) {
    secretsFile.withInputStream { secretsProps.load(it) }
}

var generateWorkerSecrets = tasks.register("generateWorkerSecrets", Copy) {
    var replaceProperties = [
            worker_default_modpack_id     : secretsProps.getProperty('worker_default_modpack_id', ''),
            worker_default_modpack_api_key: secretsProps.getProperty('worker_default_modpack_api_key', ''),
            worker_default_base_url       : secretsProps.getProperty('worker_default_base_url',
                    'https://dummyscoreboard-worker.vitoralcantara1722.workers.dev'),
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates-secrets"
    into "build/generated/sources/workerSecrets"
}

sourceSets.main.java.srcDir generateWorkerSecrets

neoForge.ideSyncTask generateModMetadata
neoForge.ideSyncTask generateWorkerSecrets


publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
