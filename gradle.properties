# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
# NOTE: Parchment mappings aren't published for 26.1.2 yet (as of this port), so unlike the
# 1.21.1 branch there's no parchment_minecraft_version/parchment_mappings_version block here -
# see build.gradle. Re-add it once ParchmentMC catches up.
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.1.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.87
# The Curios API version to compile/dev-test against (from Modrinth maven, group maven.modrinth).
# Curios jumped 9.x -> 15.x for this Minecraft version; the API itself also changed - see
# curios/CuriosCompat.java for what was ported.
curios_version=15.0.0+26.1.2
# Dev-only test mods (localRuntime, not compiled against) so runClient has them installed
# alongside Curios to check compatibility. Not a dependency of the built mod jar. Uses the
# Modrinth *version id* (not version number) - "15.0.0" is reused by the Fabric and NeoForge
# builds of this project, so the plain version number is ambiguous on Modrinth's maven.
artifacts_version=xrizTBU2
# Relics (and its shatterbyte-lib/architectury-api dependencies) have not published a build for
# 26.1.2 yet as of this port, so they're dropped from dev-test localRuntime here entirely - add
# them back once Relics catches up (see the 1.21.1 branch for how they were wired in).
# JEI, to check the lure_bait/dummy_spawner recipes render correctly. Uses the Modrinth *version
# id* (not version number) - reused across the Fabric/Forge/NeoForge builds of this project, so
# the plain version number is ambiguous on Modrinth's maven.
jei_version=OhedJ3Iu
# Jade, so hovering over a dummy shows its health like any other living entity - no plugin code
# needed on our side, Jade's default entity component already reads it generically. Version
# number already includes the loader suffix so it isn't ambiguous like the ones above, but using
# the id keeps the pattern consistent with the rest of this file.
jade_version=fnbQ0Mb3

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=trainingdummy
# The human-readable display name for the mod.
mod_name=Training Dummy
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/ - versions only ever go up regardless of which
# Minecraft version a given branch targets, and (starting here) drop the trailing ".0" patch
# component when unused (v1.1.0 -> v1.1 going forward).
mod_version=1.2
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.trainingdummy
