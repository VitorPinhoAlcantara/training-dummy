# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.244
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)
# The Curios API version to compile/dev-test against (from Modrinth maven, group maven.modrinth)
curios_version=9.5.1+1.21.1
# Dev-only test mods (localRuntime, not compiled against) so runClient has them installed
# alongside Curios to check compatibility. Not a dependency of the built mod jar.
artifacts_version=13.2.1
relics_version=0.12.8
# Relics' own required library dependency. Uses the Modrinth *version id* (not version number) -
# "0.6.2" is reused by both the Fabric and NeoForge builds of this project, so the plain version
# number is ambiguous on Modrinth's maven; the id pins the NeoForge one specifically.
shatterlib_version=yVCCi6TK
# OctoLib's own required library dependency
architectury_version=13.0.11+neoforge
# Malum, to test the dummy against non-physical/magic damage types.
malum_version=1.8.2
# Malum's own required library dependency (not listed in Modrinth's own dependency metadata).
lodestonelib_version=1.8.2
# Mahou Tsukai, to test damage attribution for indirect/summon-based spell damage. Uses the
# Modrinth *version id* (not version number) - "1.36.27" is reused by both the 1.21.1 and 26.1.2
# builds, so the plain version number is ambiguous on Modrinth's maven (same gotcha as
# shatterlib_version/jei_version above).
mahoutsukai_version=qAJ0gGH9
# Oritech, another dev-test mod. Uses the Modrinth *version id* (not version number) - "1.2.12" is
# reused by the Fabric and NeoForge builds, so the plain version number is ambiguous on Modrinth's
# maven (same gotcha as shatterlib_version/jei_version above).
oritech_version=lxLMO7bV
# Oritech's own required dependencies. Both version numbers are also ambiguous across loaders, so
# these are Modrinth *version ids* too.
athena_version=dJgL278E
geckolib_version=Grwn5rUB
# JEI, to check the lure_bait/dummy_spawner recipes render correctly. Uses the Modrinth *version
# id* (not version number) - "19.44.0.401" is reused by the Fabric/Forge/NeoForge builds, so the
# plain version number is ambiguous on Modrinth's maven (same gotcha as shatterlib_version above).
jei_version=Tbomhybz

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=trainingdummy
# The human-readable display name for the mod.
mod_name=Training Dummy
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/ - versions only ever go up regardless of which
# Minecraft version a given branch targets, and (starting at v1.2) drop the trailing ".0" patch
# component when unused (v1.1.0 -> v1.1 going forward).
mod_version=1.6
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.trainingdummy
